name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Copy Web Assets to Android (manual cap sync)
        run: |
          ASSETS_DIR="frontend/android/app/src/main/assets"
          mkdir -p "$ASSETS_DIR/public"
          rsync -a --delete frontend/dist/ "$ASSETS_DIR/public/"
          printf '{"appId":"com.jobfinder.app","appName":"JobFinder","webDir":"dist","server":{"androidScheme":"https"}}' > "$ASSETS_DIR/capacitor.config.json"
          printf '[]' > "$ASSETS_DIR/capacitor.plugins.json"

      - name: Install Android SDK Components & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME || true

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/JobFinder-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-APK
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JobFinder ${{ github.ref_name }}
          body: |
            ## 🚀 JobFinder ${{ github.ref_name }} — Autonomous Multi-Portal Job Finder & ATS Resume Studio

            📱 **Download & install** `JobFinder-${{ github.ref_name }}.apk` directly on Android.

            ---

            ### ✨ What's New in v2.1.0

            * 🔒 **Complete Detail Sanitization**: Completely removed all developer college, internship, and personal skill fallbacks from the ATS Resume preview, LaTeX generator, and local schema.
            * 🧪 **Candidate Profile Beta Phase**: Added explicit Beta status tags and informative privacy notice in the Candidate Profile & ATS Resume studio, sidebar, and mobile navigation.
            * 📄 **Jake's ATS Resume Studio**: Fully dynamic LaTeX generation and live A4 preview using only the user's explicitly entered profile details.
            * 🔍 **9-Portal Parallel Search Engine**: Naukri, LinkedIn, Indeed, Internshala, Shine, Freshersworld, Apna, Glassdoor & Instahyre.
            * 📱 **Native Android Build**: Single versioned `JobFinder-${{ github.ref_name }}.apk` artifact.
            * 💾 **100% Local IndexedDB**: All your candidate details and job trackers remain strictly on your device. Zero cloud leakage.

            ---

            ### 📦 Assets
            * `JobFinder-${{ github.ref_name }}.apk` — Android direct install package
          draft: false
          prerelease: false
          files: |
            release/JobFinder-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


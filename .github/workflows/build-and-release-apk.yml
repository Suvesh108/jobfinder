name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named Release APKs
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/JobFinder-${{ github.ref_name }}.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/jobfinder.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-APK
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            * **Android APK (Direct Install)**: `JobFinder-${{ github.ref_name }}.apk`

            ### ✨ Features
            * **Native Mobile Layout**: Built specifically for Android touch displays with zero viewport clipping.
            * **Unified Job Search Engine**: Concurrently queries top job boards with real-time progress indicators.
            * **AI Chat Copilot**: Interactive drag-and-drop resume tailoring using Gemini, OpenRouter, Groq, and DeepSeek.
            * **Jake's ATS Resume Generator**: Real-time ATS single-column resume with interactive in-browser LaTeX (`.tex`) code editor.
            * **Application Tracker**: Pipeline management with follow-up reminders, Notion database sync, and CSV export.
            * **Full Offline Persistence**: Powered by Dexie.js (IndexedDB) with backup export & import.
          draft: false
          prerelease: false
          files: |
            release/JobFinder-${{ github.ref_name }}.apk
            release/jobfinder.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/JobFinder-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-APK
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JobFinder ${{ github.ref_name }}
          body: |
            * **Android APK (Direct Install)**: `JobFinder-${{ github.ref_name }}.apk`
            * **Desktop / Web Application**: `index.html` (PWA Offline Ready)

            ### ✨ Features & Improvements in ${{ github.ref_name }}

            * 📱 **Dedicated Native Mobile UX**: Built specifically for Android touch displays with centered header, bottom glassmorphic navigation dock, and zero-overflow layout.
            * 🔍 **Unified Luxury Job Search Engine**: Parallel aggregator across LinkedIn, Naukri, Indeed, Glassdoor, Internshala, Shine, Apna, Freshersworld & Instahyre.
            * 🤖 **Intelligent AI Chat Copilot**: Drag-and-drop resume tailoring with multi-provider AI support (Google Gemini, OpenRouter, NVIDIA NIM, Groq, DeepSeek).
            * 📄 **Jake's ATS Resume Generator**: Real-time ATS single-column resume with interactive in-browser LaTeX (`.tex`) code editor and instant PDF export.
            * 📋 **Application Pipeline Tracker**: Kanban and list views with follow-up notifications, Notion database synchronization, and CSV export.
            * 🛡️ **Defensive Security Hardening**: OWASP Top 10 compliance with LaTeX syntax injection escaping, strict schema sanitization, and reverse tabnabbing protection.
            * 💾 **Full Offline Persistence**: Zero-cloud-dependency local database powered by Dexie.js (IndexedDB) with backup export & import.
          draft: false
          prerelease: false
          files: |
            release/JobFinder-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

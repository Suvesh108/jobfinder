name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Copy Web Assets to Android (manual cap sync)
        run: |
          ASSETS_DIR="frontend/android/app/src/main/assets"
          mkdir -p "$ASSETS_DIR/public"
          rsync -a --delete frontend/dist/ "$ASSETS_DIR/public/"
          printf '{"appId":"com.jobfinder.app","appName":"JobFinder","webDir":"dist","server":{"androidScheme":"https"}}' > "$ASSETS_DIR/capacitor.config.json"
          printf '[]' > "$ASSETS_DIR/capacitor.plugins.json"

      - name: Install Android SDK Components & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME || true

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/JobFinder-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-APK
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JobFinder ${{ github.ref_name }}
          body: |
            ## 🚀 JobFinder ${{ github.ref_name }} — Autonomous Multi-Portal Job Finder & ATS Resume Studio

            📱 **Download & install** `JobFinder-${{ github.ref_name }}.apk` directly on Android.

            ---

            ### ✨ What's New in v2.1.3

            * 📱 **Android Native Settings Accordion (Expand & Shrink System)**: Replaced the horizontal scrolling subtab bar on Android with a responsive, vertical expand and shrink accordion system. Tap any setting section (AI, Scrapers, Preferences, Database, About) to smoothly expand or shrink it on demand, with a 1-tap "Expand All / Shrink All" control.
            * 🖥️ **Preserved Web & Desktop Layout**: Retained the full two-column sidebar layout on web and desktop while providing a native touch-first experience inside the Android APK.
            * 🔐 **Unified Permanent Android Keystore**: Signed with permanent `jobfinder.keystore` for seamless OTA in-app updates.
            * 🎨 **Bespoke Circular Launcher Icon**: Calibrated 108dp safe-zone scaling prevents edge cropping on circular Android launchers.
            * 🚀 **Single Verified APK Artifact**: Direct standalone installation package `JobFinder-${{ github.ref_name }}.apk`.

            ---

            ### 📦 Assets
            * `JobFinder-${{ github.ref_name }}.apk` — Android direct install package
          draft: false
          prerelease: false
          files: |
            release/JobFinder-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


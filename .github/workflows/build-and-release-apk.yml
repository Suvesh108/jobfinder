name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Copy Web Assets to Android (replaces npx cap sync)
        run: |
          ASSETS_DIR="frontend/android/app/src/main/assets"
          mkdir -p "$ASSETS_DIR/public"
          rsync -a --delete frontend/dist/ "$ASSETS_DIR/public/"
          printf '{"appId":"com.jobfinder.app","appName":"JobFinder","webDir":"dist","server":{"androidScheme":"https"}}' > "$ASSETS_DIR/capacitor.config.json"
          printf '[]' > "$ASSETS_DIR/capacitor.plugins.json"

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named Release APK
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/JobFinder-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobFinder-APK
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JobFinder ${{ github.ref_name }}
          body: |
            ## 🚀 JobFinder ${{ github.ref_name }} — Autonomous Multi-Portal Job Finder & ATS Resume Studio

            📱 **Download & install** `JobFinder-${{ github.ref_name }}.apk` directly on Android.

            ---

            ### ✨ What's New in v2.0.0

            * 🔍 **9-Portal Parallel Search Engine**: Naukri, LinkedIn, Indeed, Internshala, Shine, Freshersworld, Apna, Glassdoor & Instahyre — all in one concurrent scan with 100% verified real URLs (zero broken links).
            * 📄 **Jake's ATS Resume Studio**: Real-time A4 paper preview + in-browser LaTeX editor. Copy to Overleaf, download `.tex`, or export PDF directly.
            * 🤖 **AI Chat Copilot**: Drag-and-drop job cards onto the copilot to instantly tailor bullets. Supports Google Gemini, Groq, DeepSeek, OpenRouter, NVIDIA NIM & OpenAI.
            * 📱 **Native Android Build**: Touch-optimized UI with bottom glassmorphic dock, haptic feedback, and in-app OTA update checker.
            * 🎨 **Dark OLED Brand Icon**: New high-contrast black background with white briefcase & electric cyan search lens logo.
            * 🔒 **Zero Pre-Seeded Data**: Clean blank profile — no personal data from the developer shipped in the template.
            * 💾 **100% Local IndexedDB**: All your jobs, applications, and profile data stay on-device. No cloud. No tracking.
            * 📋 **Kanban Application Tracker**: Full pipeline across Wishlist → Applied → Interview → Offer → Rejected.

            ---

            ### 📦 Assets
            * `JobFinder-${{ github.ref_name }}.apk` — Android direct install package
          draft: false
          prerelease: false
          files: |
            release/JobFinder-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

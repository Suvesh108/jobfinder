# ==============================================================================
# JobFinder ATS & Career-Page Companies Configuration
#
# Supported Platforms:
# - greenhouse:  https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
# - lever:       https://api.lever.co/v0/postings/{slug}?mode=json
# - ashby:       https://api.ashbyhq.com/posting-api/job-board/{slug}
# - workday:     https://{tenant}.wd{n}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
# - generic:     Playwright-based heuristic extraction from careers_url
# ==============================================================================

companies:
  # 1. Greenhouse Companies
  - name: "Postman"
    platform: "greenhouse"
    slug: "postman"
    enabled: true

  - name: "Razorpay"
    platform: "greenhouse"
    slug: "razorpaysoftwareprivatelimited"
    enabled: true

  - name: "Groww"
    platform: "greenhouse"
    slug: "groww"
    enabled: true

  - name: "Stripe"
    platform: "greenhouse"
    slug: "stripe"
    enabled: true

  - name: "Coinbase"
    platform: "greenhouse"
    slug: "coinbase"
    enabled: true

  # 2. Lever Companies
  - name: "CRED"
    platform: "lever"
    slug: "cred"
    enabled: true

  # 3. Ashby Companies
  - name: "Sentry"
    platform: "ashby"
    slug: "sentry"
    enabled: true

  - name: "Linear"
    platform: "ashby"
    slug: "linear"
    enabled: true

  - name: "Perplexity AI"
    platform: "ashby"
    slug: "perplexity"
    enabled: true

  - name: "Browserbase"
    platform: "ashby"
    slug: "browserbase"
    enabled: true

  # 4. Generic Self-Hosted Careers Page (Playwright Heuristic Scraper)
  - name: "Zerodha"
    platform: "generic"
    careers_url: "https://zerodha.com/careers"
    enabled: true
